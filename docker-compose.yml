services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tripplanner_postgres
    environment:
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner123
      POSTGRES_DB: tripplanner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner -d tripplanner_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Weaviate Vector DB ──────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.25.4
    container_name: tripplanner_weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-transformers'
      ENABLE_MODULES: 'text2vec-transformers'
      TRANSFORMERS_INFERENCE_API: 'http://t2v-transformers:8080'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - t2v-transformers

  # ── Text2Vec Transformers (local embedding model) ───────────────────────────
  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-multi-qa-MiniLM-L6-cos-v1
    container_name: tripplanner_t2v
    environment:
      ENABLE_CUDA: '0'   # Set to '1' if you have a GPU
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  weaviate_data:
